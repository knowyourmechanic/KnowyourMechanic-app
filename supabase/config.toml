project_id = "knowyourmechanic"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = false
template = "Your KnowYourMechanic code is {{ .Code }}"

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.msg91-sms]
verify_jwt = false

# Razorpay calls this directly (HMAC-signed, no Supabase JWT).
[functions.razorpay-webhook]
verify_jwt = false
